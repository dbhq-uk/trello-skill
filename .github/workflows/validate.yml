name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  # THE ESTATE FLOOR, defined once in dbhq-uk/.github (dbhq-uk/.github#4):
  # SKILL.md frontmatter parses as YAML and names its directory, plugin.json
  # parses and carries no version, skill paths are braced, every shell script
  # passes bash -n and shellcheck, ruff E9,F where there is Python (none
  # here), and no em or en dashes. Pinned by SHA; Dependabot moves the pin.
  floor:
    uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@af131df509f44eb9abfe8b37ad6299c11f496c5f

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE TEST SUITE, added 18 Sep 2026. Until then this workflow validated a
      # manifest, parsed the shell and read the frontmatter - it checked that
      # the pack was well formed and nothing at all about whether it worked, on
      # 1,239 lines of bash driving a live REST API that holds somebody's
      # boards. The suite is offline: a fake curl on PATH and a fixture $HOME,
      # so it needs no API key and makes no request.
      #
      # What it is actually guarding, in order of what it would cost to get
      # wrong: every request goes to api.trello.com and nowhere else (the
      # credential is in the Authorization header of every call, so a request built
      # against the wrong host hands a Trello token to that host); caller text
      # is sent with --data-urlencode rather than pasted into the query string;
      # and every entry script runs the ~/.trello migration, guarded, which is
      # the exact thing three of outlook's four entry scripts got wrong. The
      # migration and every request now live once, in skills/trello/scripts/lib.sh.
      - name: Run unit tests
        run: bash skills/trello/tests/helpers_test.sh
