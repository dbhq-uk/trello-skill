name: Validate

on:
  push:
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <(find skills -name '*.sh')
          exit $fail

      # A real YAML parse, not a search for `name:` and `description:`. An
      # unquoted `: ` inside a description makes the frontmatter invalid YAML
      # with both keys still present, so a key search passes it, and Codex
      # skips any skill whose frontmatter does not parse (openai/codex#8609).
      # PyYAML is installed here, in CI only; the skills themselves need none.
      - name: Every SKILL.md has frontmatter that parses as YAML
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          skills = sorted(pathlib.Path("skills").glob("*/SKILL.md"))
          if not skills:
              sys.exit("no skills/*/SKILL.md found")
          ok = True
          for skill in skills:
              text = skill.read_text(encoding="utf-8")
              match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not match:
                  print(f"{skill}: no frontmatter"); ok = False; continue
              try:
                  meta = yaml.safe_load(match.group(1))
              except yaml.YAMLError as err:
                  print(f"{skill}: frontmatter is not valid YAML: {err}"); ok = False; continue
              if not isinstance(meta, dict):
                  print(f"{skill}: frontmatter is not a mapping"); ok = False; continue
              name, directory = meta.get("name"), skill.parent.name
              if name != directory:
                  print(f"{skill}: name is {name!r}, directory is {directory!r}"); ok = False
              elif not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                  print(f"{skill}: name must be lowercase letters, digits and hyphens, at most 64"); ok = False
              description = meta.get("description")
              if not isinstance(description, str) or not description.strip():
                  print(f"{skill}: description is missing or empty"); ok = False
              elif len(description) > 1024:
                  print(f"{skill}: description is {len(description)} characters, over 1024"); ok = False
          if ok:
              print(f"{len(skills)} SKILL.md file(s) OK")
          sys.exit(0 if ok else 1)
          PY

      # THE TEST SUITE, added 18 Sep 2026. Until then this workflow validated a
      # manifest, parsed the shell and read the frontmatter - it checked that
      # the pack was well formed and nothing at all about whether it worked, on
      # 1,239 lines of bash driving a live REST API that holds somebody's
      # boards. The suite is offline: a fake curl on PATH and a fixture $HOME,
      # so it needs no API key and makes no request.
      #
      # What it is actually guarding, in order of what it would cost to get
      # wrong: every request goes to api.trello.com and nowhere else (the
      # credential is in the Authorization header of every call, so a request built
      # against the wrong host hands a Trello token to that host); caller text
      # is sent with --data-urlencode rather than pasted into the query string;
      # and every entry script runs the ~/.trello migration, guarded, which is
      # the exact thing three of outlook's four entry scripts got wrong. The
      # migration and every request now live once, in skills/trello/scripts/lib.sh.
      - name: Run unit tests
        run: bash skills/trello/tests/helpers_test.sh

  # THE SAME TWO LINTERS IN EVERY DBHQ SKILL REPO, added 17 Sep 2026. Nine of
  # the fourteen ran no linter at all, in an estate that is mostly bash and
  # Python - so a shell quoting hazard or a name that does not exist was only
  # caught by somebody reading the diff.
  #
  # IT IS A DELIBERATELY NARROW RUFF SELECTION. `E9` is syntax errors and
  # `F` is the pyflakes set: undefined names, unused imports, f-strings with no
  # placeholders. Those are bugs. The full default selection flags import order
  # and whitespace across every one of these repos, which would have meant
  # reformatting thousands of lines in code other sessions are working in
  # before the gate could go green - a large diff to buy a gate that catches
  # less than this one does. garmin and imager run the full ruff and keep it.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # -S warning, not the default, because `info` and `style` fire on
        # idioms these scripts use deliberately. xargs -r so a repo with no
        # shell scripts is a pass rather than a shellcheck usage error.
        run: |
          find . -name '*.sh' -not -path '*/.venv/*' -print0 \
            | xargs -0 -r shellcheck -S warning
